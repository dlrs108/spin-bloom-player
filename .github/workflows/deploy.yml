name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build
        run: bun run build
        env:
          BASE_URL: /${{ github.event.repository.name }}/

      # 👇 帮我们找出 index.html 到底生成在哪了
      - name: Debug Output
        run: |
          echo "=== 根目录文件 ==="
          ls -la
          echo "=== 查找 index.html 位置 ==="
          find . -name "index.html" -not -path "*/node_modules/*"

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # 🚨 注意：这里先填 "./dist"，如果跑完报错找不到文件，
          # 请看 Actions 日志里 "Debug Output" 打印出来的路径，把这里改掉。
          path: ".dist/client"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
